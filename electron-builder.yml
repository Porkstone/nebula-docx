appId: com.nebula.docx
productName: Nebula DOCX
copyright: Copyright © 2026 Porkstone
asar: true
electronDist: node_modules/electron/dist
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - LICENSE
  - THIRD-PARTY-NOTICES.txt
extraResources:
  - from: build/icon.ico
    to: icon.ico
# All document libraries are bundled by Vite; no runtime node_modules are needed.
nodeGypRebuild: false
npmRebuild: false
win:
  executableName: nebula-docx
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: nebula-docx-${version}.${ext}
  signAndEditExecutable: true
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  runAfterFinish: false
  deleteAppDataOnUninstall: false
publish: null
